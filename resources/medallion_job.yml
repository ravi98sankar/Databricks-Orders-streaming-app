resources:
  jobs:
    medallion_pipeline_job:
      name: medallion-pipeline-${bundle.target}

      tasks:
        # Bronze -> Silver -> Gold (SQL models) + the Python-model showcase,
        # all run in one `dbt run` since they share the same dbt project /
        # DAG. streaming_table / materialized_view models are backed by a
        # Databricks-managed Lakeflow Declarative Pipeline automatically --
        # no separate pipeline resource is declared here.
        - task_key: dbt_run_test
          environment_key: dbt_env
          dbt_task:
            # ${workspace.file_path} is the absolute workspace path the
            # bundle's files get synced to (repo root) -- the Jobs API
            # rejects ".."-style traversal in these fields, so this is the
            # correct way to point at dbt_project.yml. profiles_directory,
            # unlike project_directory, must be RELATIVE TO project_directory
            # (an absolute path here was rejected the same way ".." was) --
            # profiles.yml lives in the same folder, so that's just ".".
            project_directory: ${workspace.file_path}
            profiles_directory: .
            catalog: ${var.catalog}
            schema: ${var.schema}
            warehouse_id: ${var.warehouse_id}
            # Supplying catalog/schema/warehouse_id above makes Databricks
            # auto-generate and manage the dbt connection profile itself,
            # under a fixed target name "databricks_cluster" -- our own
            # profiles.yml's "dev"/"prod" target names are NOT used here
            # (confirmed by a real run error: "does not have a target named
            # 'dev'"). Do not pass --target on these commands; dev/prod
            # schema separation already happens via ${var.schema} above.
            commands:
              - "dbt deps"
              - "dbt seed"
              - "dbt run"
              - "dbt test"

        # LakeBase sync is an external Postgres JDBC write -- not expressible
        # as a dbt model / Lakeflow table, so it runs as a plain Spark task
        # after the dbt run/test succeed.
        - task_key: lakebase_sync
          depends_on:
            - task_key: dbt_run_test
          environment_key: lakebase_env
          # This workspace only supports serverless compute -- new_cluster
          # (classic) was rejected outright. Serverless environments only
          # support pip-installable dependencies, not Maven/JVM libraries,
          # so the org.postgresql:postgresql Maven library from the classic
          # attempt is dropped here; serverless's base runtime is expected
          # to already carry a Postgres JDBC driver. If the real (non-dry-run)
          # write later fails with a "no suitable driver" error, that
          # assumption is wrong and needs revisiting.
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/03_lakebase_sync.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--secret-scope"
              - lakebase-${bundle.target}
          # Dry-run by default (safe): the script only attempts a real JDBC
          # write when both DRY_RUN=false AND the secret scope resolves a
          # non-empty password. Uncomment to enable real writes once the
          # LakeBase secret has been set (see resources/secrets.yml):
          # spark_env_vars:
          #   DRY_RUN: "false"

      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
        - environment_key: lakebase_env
          spec:
            environment_version: "4"
            dependencies:
              - psycopg2-binary
