resources:
  secret_scopes:
    lakebase_secrets:
      name: lakebase-${bundle.target}
      permissions:
        - level: READ
          service_principal_name: ${var.service_principal_id}

# The scope itself is version-controlled; the secret VALUE never is.
# One-time manual step after the first `databricks bundle deploy`:
#
#   databricks secrets put-secret lakebase-dev password
#   databricks secrets put-secret lakebase-prod password
