resources:
  # Must exist before the training job's first run -- mlflow.set_experiment()
  # cannot create a new experiment from inside a job
  # ("FEATURE_DISABLED: Creation of experiments in jobs is not enabled").
  experiments:
    order_anomaly_experiment:
      name: /Shared/order_anomaly_experiment_${bundle.target}

  # Decoupled from medallion_pipeline_job on purpose -- separate job,
  # separate deploy-ml-*.yml workflows, manual trigger only (no automatic
  # push trigger; retraining shouldn't fire on every unrelated dbt commit).
  jobs:
    ml_training_job:
      name: ml-training-${bundle.target}

      tasks:
        - task_key: train_anomaly_model
          environment_key: ml_env
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/10_train_anomaly_model.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--experiment-id"
              - ${resources.experiments.order_anomaly_experiment.id}

        - task_key: train_explainer_agent
          depends_on:
            - task_key: train_anomaly_model
          environment_key: ml_env
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/11_train_agent_explainer.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--experiment-id"
              - ${resources.experiments.order_anomaly_experiment.id}

      environments:
        - environment_key: ml_env
          spec:
            environment_version: "4"
            dependencies:
              - scikit-learn>=1.3.0,<2.0.0
              - mlflow>=2.14.0,<3.0.0

  # Bootstrapping note: on the very first deploy, these will likely fail to
  # create -- entity_version "1" doesn't exist until ml_training_job has
  # actually run once and registered it. Expected sequence: deploy (job +
  # experiment succeed, endpoints may error) -> bundle run ml_training_job
  # -> deploy again (endpoints now succeed, v1 exists). Also: "1" only
  # tracks the FIRST registered version -- retraining registers v2, v3, ...
  # and the endpoint won't automatically follow unless entity_version is
  # bumped (or converted to a UC model alias) after retraining.
  model_serving_endpoints:
    order_anomaly_endpoint:
      name: order-anomaly-${bundle.target}
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.order_anomaly_model
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
      permissions:
        - level: CAN_QUERY
          service_principal_name: ${var.service_principal_id}

    order_explainer_endpoint:
      name: order-explainer-${bundle.target}
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.order_anomaly_explainer
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
            # Open risk (see plan doc): unconfirmed whether environment_vars
            # is actually exposed as a DAB YAML field here (REST/SDK support
            # it; implicit SP auth from inside a serving container is
            # unconfirmed). If `bundle validate` rejects this block, the
            # fallback is a post-deploy `databricks` CLI call in the GitHub
            # Actions workflow instead of a YAML field.
            # environment_vars:
            #   DATABRICKS_HOST: "{{secrets/fm-access-${bundle.target}/host}}"
            #   DATABRICKS_TOKEN: "{{secrets/fm-access-${bundle.target}/token}}"
      permissions:
        - level: CAN_QUERY
          service_principal_name: ${var.service_principal_id}
