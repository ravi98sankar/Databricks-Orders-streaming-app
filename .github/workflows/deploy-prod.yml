name: Deploy (prod)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-prod:
    name: Deploy bundle to prod
    runs-on: ubuntu-latest
    # Configure a "production" GitHub Environment with required reviewers
    # to gate this job behind manual approval before it runs.
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_BUNDLE_VAR_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle
        run: databricks bundle deploy -t prod

      - name: Run medallion pipeline job
        run: databricks bundle run medallion_pipeline_job -t prod
