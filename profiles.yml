databricks_streaming:
  target: dev
  outputs:

    # Used when this project runs as a Databricks Job dbt_task (deployed via
    # Databricks Asset Bundles). DBT_HOST and DBT_ACCESS_TOKEN are injected
    # automatically by Databricks at run time, scoped to the job's run_as
    # service principal -- no token is ever stored in this file, an env var
    # file, or a GitHub secret.
    dev:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'medallion_orders_dev') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 4

    prod:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'medallion_orders') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 4

# Local development (laptop `dbt run`, not used by the deployed job):
# keep your own target OUTSIDE this repo in ~/.dbt/profiles.yml, e.g.
#
#   databricks_streaming:
#     target: local
#     outputs:
#       local:
#         type: databricks
#         host: https://<your-workspace>.azuredatabricks.net
#         http_path: /sql/1.0/warehouses/<warehouse-id>
#         catalog: main
#         schema: medallion_orders_dev
#         token: "{{ env_var('DATABRICKS_TOKEN') }}"   # your own PAT, never committed
#         threads: 4
