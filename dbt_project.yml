name: 'medallion_orders'
version: '1.0.0'
config-version: 2

profile: 'databricks_streaming'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  medallion_orders:
    # No +database/+schema override here on purpose: the connection profile
    # (target.database / target.schema) is driven by the dbt_task's
    # catalog/schema fields in resources/medallion_job.yml, which already
    # differ correctly per bundle target (medallion_orders_dev vs
    # medallion_orders). A per-model override here previously hardcoded
    # every run to the literal "medallion_orders" schema regardless of
    # target, causing a real SCHEMA_NOT_FOUND on the dev target.
    bronze:
      +materialized: streaming_table
      +tags: ["bronze", "sql_medallion"]
    silver:
      # materialized_view (not streaming_table): the dedup logic below is an
      # unwatermarked, whole-history ROW_NUMBER() window, which is state
      # aggregation, not append-only streaming semantics.
      +materialized: materialized_view
      +tags: ["silver", "sql_medallion"]
    gold:
      +materialized: materialized_view
      +tags: ["gold", "sql_medallion"]
    python_showcase:
      +materialized: table
      +tags: ["python_showcase"]

vars:
  "dbt_dq_tools:database": "main"
  min_valid_amount: 0.01
  vip_spend_threshold: 500.0
  # No catalog/schema vars here on purpose -- see models/bronze/bronze_orders.sql,
  # which uses target.database/target.schema instead so the Auto Loader
  # landing path always matches whatever the active connection is actually
  # using, with no separate hardcoded default to drift out of sync.
