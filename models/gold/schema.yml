version: 2

models:
  - name: gold_customer_metrics
    description: >
      One row per customer with lifetime/YTD cumulative spend and VIP
      status (lifetime spend >= vip_spend_threshold).
    tags: ["gold", "sql_medallion"]
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: total_lifetime_spend
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_orders_count
        tests:
          - not_null
      - name: is_vip
        tests:
          - accepted_values:
              values: [true, false]
